name: Publicar

# Publica o Atlas no GitHub Pages. NÃO roda o pipeline de dados (precisa do laboratório `metrosp` e dos microdados
# da OD, só na máquina do autor): o CI verifica o gate P1–P6, roda os testes, constrói e publica os agregados já
# aprovados e versionados em data/processed. Publicação MANUAL (Actions -> Publicar -> Run workflow).
on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: web/package-lock.json }
      - run: pip install -r requirements.txt
      - run: npm ci
        working-directory: web
      - name: Gate P1–P6 (verificação independente, sem microdados)
        run: python -m pipeline.verify_gate
      - name: Testes do pipeline (os que dependem do laboratório são pulados)
        run: python -m pytest -q
      - name: Testes do front-end
        run: npm test
        working-directory: web
      - name: Nenhum microdado/CSV no histórico
        run: |
          set -euo pipefail
          S=$(git log --all --name-only --pretty=format: | sort -u | grep -E '^(data/raw|data/interim)|\.(csv|CSV|sav|SAV)$' || true)
          [ -z "$S" ] || { echo "ERRO: arquivos bloqueados no histórico:"; echo "$S"; exit 1; }

  construir:
    needs: verificar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
        working-directory: web
      - run: npm run copy-duckdb && npm run sync-data
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: touch web/dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with: { path: web/dist }

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
