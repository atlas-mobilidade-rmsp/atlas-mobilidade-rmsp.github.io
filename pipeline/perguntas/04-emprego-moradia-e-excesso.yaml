comparabilidade:
- 'Excesso depende da agregação (MAUP): publicamos só AMC, com faixa de sensibilidade à distância intra-unidade
  (fator 0,5–1,0).'
- Trabalho em casa e sem endereço fixo só é identificável de 2007 em diante; 1977–1997 os incluem como deslocamento
  intra-zonal (ruptura de tratamento).
- Município e subprefeitura são dominados pela capital como unidade única e não têm excesso publicado.
dados:
