id: 4
slug: emprego-moradia-e-excesso
titulo: Emprego–moradia e excesso de deslocamento
pergunta: As pessoas moram longe demais dos empregos? O deslocamento casa–trabalho é maior que o mínimo possível?
tema: recorrente
status: parcial
literatura:
- autores: Hamilton, B. W.
  ano: 1982
  titulo: Wasteful commuting
  onde: Journal of Political Economy 90(5), 1035-1053
- autores: White, M. J.
  ano: 1988
  titulo: Urban commuting journeys are not 'wasteful'
  onde: Journal of Political Economy 96(5), 1097-1110
- autores: Horner, M. W.
  ano: 2002
  titulo: Extensions to the concept of excess commuting
  onde: Environment and Planning A 34(3), 543-566
- autores: Wilson, A. G.
  ano: 1967
  titulo: A statistical theory of spatial distribution models
  onde: Transportation Research 1(3), 253-269
indicadores:
- excesso de deslocamento
- MTL
- autocontenção
vista:
  modo: pesquisas
achado:
  texto: 'Entre os ocupados com local fixo de trabalho, o deslocamento casa–trabalho médio (entre centroides de
    AMC) é de {mtl23} km em 2023 e seria de {tmin23} km se moradia e emprego fossem realocados para minimizá-lo:
    um excesso de {exc23}, pouco acima do de 2007 ({exc07}). A hipótese de distância intra-unidade muda esse número
    entre {exc_lo} e {exc_hi}. Na série comparável com 1977–1997 (que inclui trabalho em casa) o excesso é de {exc77}
    em 1977 e {exc23i} em 2023: sem tendência clara.'
