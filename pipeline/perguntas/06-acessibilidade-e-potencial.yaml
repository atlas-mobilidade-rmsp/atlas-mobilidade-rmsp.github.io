comparabilidade:
- Acessibilidade aqui é por distância (centroides), não por tempo de transporte público real.
- β difere por edição; Gini de potenciais com β distintos deve ser lido como ordem de grandeza.
- Trabalho em casa e sem endereço fixo só é identificável de 2007 em diante; 1977–1997 os incluem como deslocamento
  intra-zonal (ruptura de tratamento).
dados:
- OD Metrô-SP 1977–2023 (série harmonizada)
pendencias:
