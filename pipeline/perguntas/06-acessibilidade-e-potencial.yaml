achado:
  texto: O Gini do potencial de empregos entre as AMC (ponderado pela população) caiu de {g77} em 1977 para {g97}
    em 1997 — mesmo tratamento dos dados — e chegou a {g23} em 2023. A partir de 2007 o β é calibrado sem quem trabalha
    em casa ou sem local fixo, o que reduz a comparabilidade com o período anterior; a queda até 1997 é a leitura
    mais segura.
