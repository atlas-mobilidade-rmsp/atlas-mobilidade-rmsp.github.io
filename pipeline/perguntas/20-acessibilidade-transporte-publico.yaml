comparabilidade:
- AOP/IPEA cobre só São Paulo (transporte público, carro, a pé) e Guarulhos (carro, a pé); sem transporte público
  em Guarulhos e nos demais municípios.
- 'Acessibilidade de 2019 (pico da manhã) e população/renda de 2010 (do próprio AOP): vintages diferentes da OD.'
- Média ponderada pela população dos hexágonos H3 (res. 9) cujo centroide cai na unidade; só unidades com ≥ 90%
  de cobertura.
dados:
- AOP/IPEA (aopdata v1.0.0), acesso a oportunidades 2019
- OD Metrô-SP 2023 (para o contexto)
pendencias:
- GTFS próprio da RMSP (SPTrans/EMTU/Metrô/CPTM) para cobrir os demais municípios e 2023 — F6b.
